# Deploys to Vercel (free Hobby) on every push to main.
# Setup (one-time):
# 1. Create a Vercel account and import this GitHub repo (or run `npx vercel` locally once).
# 2. Create a Vercel token: https://vercel.com/account/tokens
# 3. In GitHub → Settings → Secrets and variables → Actions, add:
#    - VERCEL_TOKEN
#    - VERCEL_ORG_ID      (from .vercel/project.json after `vercel link`)
#    - VERCEL_PROJECT_ID  (from .vercel/project.json after `vercel link`)
#
# Alternative: skip this workflow and use Vercel’s built-in GitHub integration
# (Project → Settings → Git) — no Action secrets needed.

name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
